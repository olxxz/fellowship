name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build estático
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Configurar o Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: pnpm install --frozen-lockfile

      # O Pages é estático: publica só o protótipo (/demo), o design system e a página inicial.
      # O app com login (app/(conta)) precisa de servidor e fica na Vercel.
      - name: Remover as rotas que precisam de servidor
        run: rm -rf "apps/web/app/(conta)"

      - name: Build do app web como site estático
        run: pnpm --filter @fellowship/web build
        env:
          STATIC_EXPORT: "1"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
